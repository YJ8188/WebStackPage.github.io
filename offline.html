<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离线模式 - 何哥导航</title>
    <style>
        :root {
            color-scheme: light dark;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }
        .card {
            width: min(92vw, 560px);
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 16px;
            padding: 28px 24px;
            box-shadow: 0 24px 60px rgba(2, 6, 23, 0.45);
        }
        h1 {
            margin: 0 0 12px;
            font-size: 22px;
            color: #f8fafc;
        }
        p {
            margin: 0 0 16px;
            line-height: 1.7;
            color: #cbd5e1;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        a, button {
            border: 1px solid rgba(148, 163, 184, 0.4);
            background: #1d4ed8;
            color: #fff;
            padding: 9px 14px;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }
        a.secondary, button.secondary {
            background: transparent;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>当前处于离线模式</h1>
        <p>网络暂时不可用，已为你保留可离线访问的页面与缓存内容。恢复网络后可自动同步最新数据。</p>
        <div class="actions">
            <button onclick="location.reload()">重新尝试</button>
            <a class="secondary" href="/index.html">返回首页</a>
            <a class="secondary" href="/erp-ant.html">进入ERP</a>
        </div>
    </main>
</body>
</html>
