<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 何哥技术员网址导航</title>
    <meta name="description" content="登录何哥技术员网址导航，同步您的收藏和设置">
    
    <!-- 样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/login.css">
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://supabase.co; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;">
</head>

<body class="bg-gradient">
    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="text-center mb-4">
                <img src="/assets/images/logo@2x.png" alt="何哥导航" class="logo" width="120">
                <h1 class="h4 mt-3 text-white">何哥导航</h1>
                <p class="text-white-50">登录以同步您的数据</p>
            </div>
            
            <!-- 登录表单 -->
            <form id="loginForm" class="login-form">
                <div class="mb-3">
                    <label for="email" class="form-label text-white">邮箱地址</label>
                    <input 
                        type="email" 
                        class="form-control form-control-lg" 
                        id="email" 
                        placeholder="请输入邮箱地址"
                        required>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label text-white">密码</label>
                    <input 
                        type="password" 
                        class="form-control form-control-lg" 
                        id="password" 
                        placeholder="请输入密码"
                        required>
                </div>
                
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label text-white" for="rememberMe">
                        记住登录状态
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg w-100" id="loginBtn">
                    <span class="spinner-border spinner-border-sm d-none" id="loginSpinner"></span>
                    <span id="loginText">登录</span>
                </button>
                
                <!-- 注册链接 -->
                <div class="text-center mt-3">
                    <p class="text-white-50">
                        还没有账号？
                        <a href="#" onclick="showRegisterForm()" class="text-white">立即注册</a>
                    </p>
                    <p class="text-white-50">
                        <a href="index.html" class="text-white-50">
                            <i class="fa fa-arrow-left me-1"></i>
                            返回首页
                        </a>
                    </p>
                </div>
            </form>
            
            <!-- 注册表单（默认隐藏） -->
            <form id="registerForm" class="login-form" style="display: none;">
                <div class="mb-3">
                    <label for="regEmail" class="form-label text-white">邮箱地址</label>
                    <input 
                        type="email" 
                        class="form-control form-control-lg" 
                        id="regEmail" 
                        placeholder="请输入邮箱地址"
                        required>
                </div>
                
                <div class="mb-3">
                    <label for="regPassword" class="form-label text-white">密码</label>
                    <input 
                        type="password" 
                        class="form-control form-control-lg" 
                        id="regPassword" 
                        placeholder="请输入密码（至少6位）"
                        required>
                </div>
                
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label text-white">确认密码</label>
                    <input 
                        type="password" 
                        class="form-control form-control-lg" 
                        id="confirmPassword" 
                        placeholder="请再次输入密码"
                        required>
                </div>
                
                <button type="submit" class="btn btn-success btn-lg w-100" id="registerBtn">
                    <span class="spinner-border spinner-border-sm d-none" id="registerSpinner"></span>
                    <span id="registerText">注册</span>
                </button>
                
                <!-- 登录链接 -->
                <div class="text-center mt-3">
                    <p class="text-white-50">
                        已有账号？
                        <a href="#" onclick="showLoginForm()" class="text-white">立即登录</a>
                    </p>
                    <p class="text-white-50">
                        <a href="index.html" class="text-white-50">
                            <i class="fa fa-arrow-left me-1"></i>
                            返回首页
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Toast容器 -->
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer">
        <!-- Toast消息将在这里生成 -->
    </div>
    
    <script type="module" src="./js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
