    <!-- 主入口 -->
    <script>
        let mobileAppBootstrapped = false;

        async function bootstrapMobileERP() {
            if (mobileAppBootstrapped) return;
            mobileAppBootstrapped = true;
            console.log('应用已就绪');

            // 检查登录状态
            const isAuthenticated = MobileERP.isAuthenticated();

            if (!isAuthenticated) {
                document.getElementById('loadingContainer').classList.add('hidden');
                document.getElementById('notLoggedIn').classList.remove('hidden');
                return;
            }

            // 显示主内容
            document.getElementById('loadingContainer').classList.add('hidden');
            document.getElementById('erpContent').classList.remove('hidden');

            // 注册路由
            window.Router.registerRoutes({
                '/dashboard': async () => {
                    setTabbarVisible(true);
                    await window.DashboardModule.init();
                    updateTabbar('dashboard');
                },
                '/orders': async (params) => {
                    setTabbarVisible(true);
                    document.getElementById('ordersPage').classList.remove('hidden');
                    await window.OrderModule.init(params || {});
                    updateTabbar('orders');
                },
                '/order/detail': async (params) => {
                    setTabbarVisible(false);
                    document.getElementById('orderDetailPage').classList.remove('hidden');
                    await window.OrderModule.loadOrderDetail(params.id);
                },
                '/order/create': async () => {
                    setTabbarVisible(true);
                    document.getElementById('dashboardPage').classList.remove('hidden');
                    await window.DashboardModule.init();
                    updateTabbar('dashboard');
                    await window.OrderModule.showCreateOrderModal();
                },
                '/customers': async () => {
                    setTabbarVisible(true);
                    document.getElementById('customersPage').classList.remove('hidden');
                    await window.CustomerModule.init();
                },
                '/customer/detail': async (params) => {
                    setTabbarVisible(true);
                    document.getElementById('customersPage').classList.remove('hidden');
                    await window.CustomerModule.init();
                    if (params?.id) {
                        await window.CustomerModule.showCustomerInfoModalById(params.id);
                    }
                },
                '/products': async () => {
                    setTabbarVisible(true);
                    document.getElementById('productsPage').classList.remove('hidden');
                    await window.ProductModule.init();
                },
                '/product/detail': async (params) => {
                    setTabbarVisible(true);
                    window.Toast.info('产品详情功能开发中');
                },
                '/inventory': async (params) => {
                    setTabbarVisible(true);
                    document.getElementById('inventoryPage').classList.remove('hidden');
                    await window.InventoryModule.init(params || {});
                    updateTabbar('inventory');
                },
                '/finance': async () => {
                    setTabbarVisible(true);
                    document.getElementById('financePage').classList.remove('hidden');
                    await window.FinanceModule.init();
                    updateTabbar('finance');
                },
                '/banking': async (params) => {
                    setTabbarVisible(true);
                    document.getElementById('bankingPage').classList.remove('hidden');
                    await window.BankingModule.init(params || {});
                },
                '/notes': async (params) => {
                    setTabbarVisible(true);
                    document.getElementById('notesPage').classList.remove('hidden');
                    await window.NotesModule.init(params || {});
                },
                '/profile': async () => {
                    setTabbarVisible(true);
                    document.getElementById('profilePage').classList.remove('hidden');
                    await window.ProfileModule.init();
                    updateTabbar('profile');
                }
            });

            // 底部标签栏切换
            document.querySelectorAll('.tabbar-item').forEach(item => {
                item.addEventListener('click', () => {
                    const page = item.dataset.page;
                    window.Router.push(`/${page}`);
                });
            });

            // 返回按钮
            document.querySelectorAll('[id$="BackBtn"]').forEach(btn => {
                btn.addEventListener('click', () => {
                    window.Router.back();
                });
            });

            // 路由初始化由 Router.registerRoutes 内部完成，避免重复触发
        }

        if (window.MobileERP && typeof window.MobileERP.onReady === 'function') {
            window.MobileERP.onReady(bootstrapMobileERP);
        } else if (window.EventBus && typeof window.EventBus.on === 'function') {
            window.EventBus.on('app:ready', bootstrapMobileERP);
        } else {
            setTimeout(bootstrapMobileERP, 0);
        }

        // 更新底部标签栏状态
        function updateTabbar(activePage) {
            document.querySelectorAll('.tabbar-item').forEach(item => {
                if (item.dataset.page === activePage) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        function setTabbarVisible(visible) {
            const tabbar = document.querySelector('.tabbar');
            if (!tabbar) return;
            if (visible) {
                tabbar.classList.remove('hidden');
            } else {
                tabbar.classList.add('hidden');
            }
        }
    </script>
