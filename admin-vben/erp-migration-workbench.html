<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ERP迁移工作台</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --sub: #64748b;
      --accent: #0f766e;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: radial-gradient(circle at 0 0, #dff7f1 0%, var(--bg) 45%);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }
    .sub {
      margin: 6px 0 0;
      color: var(--sub);
      font-size: 14px;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button, a.btn {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      height: 36px;
      padding: 0 14px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      background: #fff;
      min-height: 102px;
    }
    .card .label {
      margin: 0;
      font-size: 13px;
      color: var(--sub);
    }
    .card .value {
      margin: 10px 0 0;
      font-size: 30px;
      line-height: 1;
      font-weight: 700;
      color: var(--accent);
    }
    .meta {
      display: grid;
      gap: 8px;
      color: var(--sub);
      font-size: 13px;
    }
    .warn {
      margin-top: 10px;
      color: #b42318;
      background: #fee4e2;
      border: 1px solid #fecdca;
      border-radius: 10px;
      padding: 10px 12px;
      display: none;
      font-size: 13px;
    }
    .steps {
      margin: 0;
      padding-left: 18px;
      color: var(--sub);
      font-size: 14px;
      display: grid;
      gap: 6px;
    }
    @media (max-width: 960px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      body { padding: 12px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <div class="title-row">
        <div>
          <h1>ERP迁移工作台（Vue试点）</h1>
          <p class="sub">第一阶段：只读迁移，旧ERP保持不变，先验证账号数据连通性。</p>
        </div>
        <div class="actions">
          <button id="refreshBtn" class="primary" type="button">刷新数据</button>
          <a class="btn" href="/erp-ant.html" target="_blank" rel="noopener">打开旧ERP</a>
        </div>
      </div>
      <div id="errorBox" class="warn"></div>
    </section>

    <section class="panel">
      <div id="cards" class="grid"></div>
    </section>

    <section class="panel">
      <div class="meta" id="metaBox">
        <div>账号：-</div>
        <div>用户ID：-</div>
        <div>最近同步：-</div>
      </div>
    </section>

    <section class="panel">
      <h2 style="margin:0 0 10px;font-size:16px;">后续迁移节奏</h2>
      <ol class="steps">
        <li>保留旧ERP入口，先在Vue侧做模块级只读面板。</li>
        <li>逐个迁移：日常笔记、银行业务、财务管理，避免一次性切换风险。</li>
        <li>每一步都做回归审查，再开放写入功能。</li>
      </ol>
    </section>
  </div>

  <script>
    (function () {
      var cardConfig = [
        { key: 'notesCount', label: '日常笔记总数' },
        { key: 'financesCount', label: '财务记录总数' },
        { key: 'bankConnectionsCount', label: '银行连接数量' },
        { key: 'bankStatementsCount', label: '银行流水数量' }
      ];

      var cardsEl = document.getElementById('cards');
      var metaBox = document.getElementById('metaBox');
      var errorBox = document.getElementById('errorBox');
      var refreshBtn = document.getElementById('refreshBtn');

      function toNumber(value) {
        var n = Number(value);
        return Number.isFinite(n) ? n : 0;
      }

      function setError(message) {
        var text = String(message || '').trim();
        if (!text) {
          errorBox.style.display = 'none';
          errorBox.textContent = '';
          return;
        }
        errorBox.textContent = text;
        errorBox.style.display = 'block';
      }

      function formatTime(isoText) {
        if (!isoText) return '-';
        var d = new Date(isoText);
        if (Number.isNaN(d.getTime())) return '-';
        return d.toLocaleString('zh-CN', { hour12: false });
      }

      function renderCards(summary) {
        cardsEl.innerHTML = '';
        cardConfig.forEach(function (item) {
          var card = document.createElement('article');
          card.className = 'card';

          var label = document.createElement('p');
          label.className = 'label';
          label.textContent = item.label;

          var value = document.createElement('p');
          value.className = 'value';
          value.textContent = String(toNumber(summary[item.key]));

          card.appendChild(label);
          card.appendChild(value);
          cardsEl.appendChild(card);
        });
      }

      function renderMeta(summary) {
        metaBox.innerHTML = '';

        var row1 = document.createElement('div');
        row1.textContent = '账号：' + String(summary.email || '-');
        var row2 = document.createElement('div');
        row2.textContent = '用户ID：' + String(summary.userId || '-');
        var row3 = document.createElement('div');
        row3.textContent = '最近同步：' + formatTime(summary.refreshedAt);

        metaBox.appendChild(row1);
        metaBox.appendChild(row2);
        metaBox.appendChild(row3);
      }

      async function loadSummary() {
        refreshBtn.disabled = true;
        refreshBtn.textContent = '刷新中...';
        setError('');

        try {
          var response = await fetch('/api/erp-migration/summary', { method: 'GET' });
          var payload = await response.json();
          if (!payload || Number(payload.code) !== 0 || !payload.data) {
            throw new Error((payload && payload.message) || '迁移数据获取失败');
          }
          renderCards(payload.data);
          renderMeta(payload.data);
        } catch (error) {
          setError(error && error.message ? error.message : '迁移数据获取失败');
        } finally {
          refreshBtn.disabled = false;
          refreshBtn.textContent = '刷新数据';
        }
      }

      refreshBtn.addEventListener('click', loadSummary);
      loadSummary();
    })();
  </script>
</body>
</html>
