(function(){
  var MOCK_ORIGIN = 'https://mock-napi.vben.pro';
  var API_PREFIX = '/api';
  var DEMO_TOKEN = 'demo-access-token';

  function absUrl(input) {

      return p || '/';
    }
    return u.pathname || '/';
  }

  function ok(data, message) {
    return {
      code: 0,
      data: data,
      message: message || 'ok',
      timestamp: new Date().toISOString()
    };
  }

  function getUserInfo() {
    return {
      id: 1,
      username: 'admin',
      realName: 'Admin',
      avatar: '/admin-vben/favicon.ico',
      desc: 'Static demo user',
      homePath: '/workspace',
      roles: ['admin']
    };
  }

  function getMenuTree() {
    return [
      {
        name: 'Dashboard',
        path: '/dashboard',
        redirect: '/analytics',
        meta: { order: -1, title: 'page.dashboard.title' },
        children: [
          {
            name: 'Analytics',
            path: '/analytics',
            component: '/dashboard/analytics/index',
            meta: { affixTab: true, title: 'page.dashboard.analytics' }
          },
          {
            name: 'Workspace',
            path: '/workspace',
            component: '/dashboard/workspace/index',
            meta: { title: 'page.dashboard.workspace' }
          }
        ]
      }
    ];
  }

  function parseBody(raw) {
    if (!raw) return {};
    if (typeof raw === 'string') {
      try { return JSON.parse(raw); } catch (e) { return {}; }
    }
    return raw;
  }

  function routeMock(path, method, body) {
    var p = String(path || '/');
    var m = String(method || 'GET').toUpperCase();

    if (p === '/auth/login' && m === 'POST') {
      return ok({ accessToken: DEMO_TOKEN, refreshToken: 'demo-refresh-token', tokenType: 'Bearer' });
    }

    if (p === '/auth/refresh' && m === 'POST') {
      return { accessToken: DEMO_TOKEN, refreshToken: 'demo-refresh-token', tokenType: 'Bearer' };
    }

    if (p === '/auth/logout' && m === 'POST') {
      return ok(true);
    }

    if (p === '/auth/codes' && m === 'GET') {
      return ok(['AC_100010', 'AC_100020', 'AC_100030']);
    }

    if (p === '/user/info' && m === 'GET') {
      return ok(getUserInfo());
    }

    if (p === '/menu/all' && m === 'GET') {
      return ok(getMenuTree());
    }

    return ok({ mocked: true, path: p, method: m, body: body || {} });
  }

  function makeJsonResponse(payload) {
    return new Response(JSON.stringify(payload), {
      status: 200,
      headers: { 'Content-Type': 'application/json' }
    });
  }

      } catch (e) {

      }
    }

    XHR.prototype.open = function(method, url) {
      this.__vbenMock = {
        enabled: isMockRequest(url),

    XHR.prototype.send = function(body) {

      setTimeout(function() {
        setProp(self, 'status', 200);
        setProp(self, 'statusText', 'OK');
        setProp(self, 'responseURL', absUrl(meta.url) ? absUrl(meta.url).href : meta.url);
        setProp(self, 'responseText', text);
        setProp(self, 'response', text);
        setProp(self, 'readyState', 4);

        self.getAllResponseHeaders = function() { return 'content-type: application/json\r\n'; };
        self.getResponseHeader = function(name) {
          return String(name || '').toLowerCase() === 'content-type' ? 'application/json' : null;
        };

        if (typeof self.onreadystatechange === 'function') {
          self.onreadystatechange(new Event('readystatechange'));
        }
        if (typeof self.onload === 'function') {
          self.onload(new Event('load'));
        }
        if (typeof self.onloadend === 'function') {

        }

          try { self.dispatchEvent(new Event('loadend')); } catch (e) {}

      }, 0);
    };
  }

  window.__VBEN_LOCAL_MOCK__ = true;
})();
