      }</script><script src="/assets/js/supabase.min.js"></script><script src="/assets/js/supabase-config.js?v=20260212-14"></script><script>
(function(){
  var MOCK_ORIGIN = 'https://mock-napi.vben.pro';
  var API_PREFIX = '/api';
  var DEMO_TOKEN = 'demo-access-token';
  var USER_PROFILE_KEY = 'vben-local-user-profile';
  var ERP_MIGRATION_TABLES = {
    notes: 'erp_notes',
    finances: 'erp_finances',
    bankConnections: 'erp_bank_connections',
    bankStatements: 'erp_bank_statement_entries'
  };

  function absUrl(input) {
    try { return new URL(String(input), window.location.origin); } catch (e) { return null; }
  }

  function isMockRequest(input) {
    var u = absUrl(input);
    if (!u) return false;
    var sameOriginApi = u.origin === window.location.origin && u.pathname.indexOf(API_PREFIX) === 0;
    var remoteMockApi = u.origin === MOCK_ORIGIN && u.pathname.indexOf(API_PREFIX) === 0;
    return sameOriginApi || remoteMockApi;
  }

  function normalizePath(input) {
    var u = absUrl(input);
    if (!u) return '/';
    if (u.pathname.indexOf(API_PREFIX) === 0) {
      var p = u.pathname.slice(API_PREFIX.length);
      return p || '/';
    }
    return u.pathname || '/';
  }

  function ok(data, message) {
    return {
      code: 0,
      data: data,
      message: message || 'ok',
      timestamp: new Date().toISOString()
    };
  }

  function getDefaultUserInfo() {
    return {
      id: 1,
      username: 'admin',
      realName: 'Admin',
      avatar: '/admin-vben/favicon.ico',
      desc: 'Static demo user',
      homePath: '/workspace',
      roles: ['admin']
    };
  }

  function saveUserInfo(profile) {
    try {
      localStorage.setItem(USER_PROFILE_KEY, JSON.stringify(profile || {}));
    } catch (e) {}
  }

  function clearUserInfo() {
    try {
      localStorage.removeItem(USER_PROFILE_KEY);
    } catch (e) {}
  }

  function getUserInfo() {
    var defaults = getDefaultUserInfo();
    try {
      var raw = localStorage.getItem(USER_PROFILE_KEY);
      if (!raw) return defaults;
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return defaults;
      return Object.assign({}, defaults, parsed);
    } catch (e) {
      return defaults;
    }
  }

  function normalizeLoginProfile(body) {
    var source = body || {};
    var identity = String(
      source.username || source.email || source.account || source.mobile || 'admin'
    ).trim();
    if (!identity) identity = 'admin';

    var realName = identity;
    if (identity.indexOf('@') > 0) {
      realName = identity.split('@')[0] || identity;
    }

    return {
      id: 1,
      username: identity,
      realName: realName,
      avatar: '/admin-vben/favicon.ico',
      desc: 'ERP user',
      homePath: '/workspace',
      roles: ['admin']
    };
  }

  function getSupabaseClient() {
    var client = window.supabaseClient;
    if (client && client.auth) {
      return client;
    }
    return null;
  }

  function toSafeMessage(error, fallback) {
    var text = String((error && error.message) || fallback || '认证失败');
    if (!text) return '认证失败';
    return text;
  }

  async function getSessionProfile() {
    var client = getSupabaseClient();
    if (!client) return null;
    try {
      var result = await client.auth.getSession();
      var session = result && result.data && result.data.session;
      var user = session && session.user;
      if (!user) return null;
      var email = user.email || '';
      var displayName = (user.user_metadata && (user.user_metadata.name || user.user_metadata.display_name)) || '';
      var profile = normalizeLoginProfile({
        username: email || displayName || 'admin'
      });
      if (displayName) {
        profile.realName = displayName;
      }
      saveUserInfo(profile);
      return {
        profile: profile,
        session: session
      };
    } catch (e) {
      return null;
    }
  }

  async function fetchUserOwnedCount(client, tableName, userId) {
    if (!client || !tableName || !userId) {
      return 0;
    }
    try {
      var query = client
        .from(tableName)
        .select('id', { count: 'exact', head: true })
        .eq('user_id', userId);
      var result = await query;
      if (result && result.error) {
        return 0;
      }
      var count = Number(result && result.count);
      return Number.isFinite(count) ? count : 0;
    } catch (e) {
      return 0;
    }
  }

  async function buildERPMigrationSummary() {
    try {
      var client = getSupabaseClient();
      if (!client) {
        return { available: false, message: 'Supabase 客户端未初始化' };
      }

      var sessionResult = await client.auth.getSession();
      var session = sessionResult && sessionResult.data && sessionResult.data.session;
      var user = session && session.user;
      if (!user || !user.id) {
        return { available: false, message: '当前未登录' };
      }

      var userId = String(user.id);
      var counts = await Promise.all([
        fetchUserOwnedCount(client, ERP_MIGRATION_TABLES.notes, userId),
        fetchUserOwnedCount(client, ERP_MIGRATION_TABLES.finances, userId),
        fetchUserOwnedCount(client, ERP_MIGRATION_TABLES.bankConnections, userId),
        fetchUserOwnedCount(client, ERP_MIGRATION_TABLES.bankStatements, userId)
      ]);

      return {
        available: true,
        userId: userId,
        email: String(user.email || ''),
        notesCount: counts[0],
        financesCount: counts[1],
        bankConnectionsCount: counts[2],
        bankStatementsCount: counts[3],
        refreshedAt: new Date().toISOString()
      };
    } catch (e) {
      return { available: false, message: toSafeMessage(e, '迁移数据读取失败') };
    }
  }

  function getMenuTree() {
    return [
      {
        name: 'Dashboard',
        path: '/dashboard',
        redirect: '/analytics',
        meta: { order: -1, title: 'page.dashboard.title' },
        children: [
          {
            name: 'Analytics',
            path: '/analytics',
            component: '/dashboard/analytics/index',
            meta: { affixTab: true, title: 'page.dashboard.analytics' }
          },
          {
            name: 'Workspace',
            path: '/workspace',
            component: '/dashboard/workspace/index',
            meta: { title: 'page.dashboard.workspace' }
          }
        ]
      },
      {
        name: 'ERPNew',
        path: '/erp-new',
        redirect: '/erp-new/desktop',
        meta: { icon: 'mdi:monitor-dashboard', title: '新ERP（试点）' },
        children: [
          {
            name: 'ERPNewWorkbench',
            path: '/erp-new/workbench',
            component: 'IFrameView',
            meta: { title: 'ERP迁移工作台', iframeSrc: '/admin-vben/erp-migration-workbench.html' }
          },
          {
            name: 'ERPNewDesktop',
            path: '/erp-new/desktop',
            component: 'IFrameView',
            meta: { title: '新ERP-桌面版', iframeSrc: '/erp-ant.html' }
          }
        ]
      }
    ];
  }

  function parseBody(raw) {
    if (!raw) return {};
    if (typeof raw === 'string') {
      try { return JSON.parse(raw); } catch (e) { return {}; }
    }
    return raw;
  }

  async function routeMock(path, method, body) {
    var p = String(path || '/');
    var m = String(method || 'GET').toUpperCase();
    var client = getSupabaseClient();

    if (p === '/auth/login' && m === 'POST') {
      var identity = String((body && (body.username || body.email || body.account)) || '').trim();
      var password = String((body && body.password) || '');
      if (!identity || !password) {
        return { code: 1, data: null, message: '请输入邮箱和密码', timestamp: new Date().toISOString() };
      }
      if (!client) {
        return { code: 1, data: null, message: '登录服务未初始化，请刷新重试', timestamp: new Date().toISOString() };
      }

      try {
        var loginResult = await client.auth.signInWithPassword({
          email: identity,
          password: password
        });
        if (loginResult && loginResult.error) {
          return { code: 1, data: null, message: toSafeMessage(loginResult.error, '邮箱或密码错误'), timestamp: new Date().toISOString() };
        }
        var session = loginResult && loginResult.data && loginResult.data.session;
        if (!session) {
          var sessionResult = await client.auth.getSession();
          session = sessionResult && sessionResult.data && sessionResult.data.session;
        }
        if (!session || !session.user) {
          return { code: 1, data: null, message: '登录成功但会话未建立，请重试', timestamp: new Date().toISOString() };
        }

        var profile = normalizeLoginProfile({
          username: session.user.email || identity
        });
        var displayName = session.user.user_metadata && (session.user.user_metadata.name || session.user.user_metadata.display_name);
        if (displayName) {
          profile.realName = displayName;
        }
        saveUserInfo(profile);
        return ok({
          accessToken: session.access_token || DEMO_TOKEN,
          refreshToken: session.refresh_token || '',
          tokenType: 'Bearer'
        });
      } catch (e) {
        return { code: 1, data: null, message: toSafeMessage(e, '登录失败，请稍后重试'), timestamp: new Date().toISOString() };
      }
    }

    if (p === '/auth/refresh' && m === 'POST') {
      if (client) {
        try {
          var sessionResult = await client.auth.getSession();
          var session = sessionResult && sessionResult.data && sessionResult.data.session;
          if (session && session.access_token) {
            return {
              accessToken: session.access_token,
              refreshToken: session.refresh_token || '',
              tokenType: 'Bearer'
            };
          }
        } catch (e) {}
      }
      return { accessToken: DEMO_TOKEN, refreshToken: 'demo-refresh-token', tokenType: 'Bearer' };
    }

    if (p === '/auth/logout' && m === 'POST') {
      if (client) {
        try { await client.auth.signOut(); } catch (e) {}
      }
      clearUserInfo();
      return ok(true);
    }

    if (p === '/auth/codes' && m === 'GET') {
      return ok(['AC_100010', 'AC_100020', 'AC_100030']);
    }

    if (p === '/user/info' && m === 'GET') {
      var sessionProfile = await getSessionProfile();
      if (sessionProfile && sessionProfile.profile) {
        return ok(sessionProfile.profile);
      }
      return ok(getUserInfo());
    }

    if (p === '/menu/all' && m === 'GET') {
      return ok(getMenuTree());
    }

    if (p === '/erp-migration/summary' && m === 'GET') {
      var summary = await buildERPMigrationSummary();
      if (!summary.available) {
        return { code: 1, data: null, message: summary.message || '暂时无法获取迁移数据', timestamp: new Date().toISOString() };
      }
      return ok(summary);
    }

    return ok({ mocked: true, path: p, method: m, body: body || {} });
  }

  function makeJsonResponse(payload) {
    return new Response(JSON.stringify(payload), {
      status: 200,
      headers: { 'Content-Type': 'application/json' }
    });
  }

  if (typeof window.fetch === 'function') {
    var rawFetch = window.fetch.bind(window);
    window.fetch = async function(input, init) {
      var url = (typeof input === 'string' || input instanceof URL) ? String(input) : ((input && input.url) || '');
      if (!isMockRequest(url)) {
        return rawFetch(input, init);
      }
      var method = (init && init.method) || (input && input.method) || 'GET';
      var body = (init && init.body) || null;
      var payload = await routeMock(normalizePath(url), method, parseBody(body));
      return makeJsonResponse(payload);
    };
  }

  if (typeof window.XMLHttpRequest === 'function') {
    var XHR = window.XMLHttpRequest;
    var rawOpen = XHR.prototype.open;
    var rawSend = XHR.prototype.send;

    function setProp(obj, key, value) {
      try {
        Object.defineProperty(obj, key, { value: value, configurable: true, writable: true });
      } catch (e) {
        try { obj[key] = value; } catch (err) {}
      }
    }

    XHR.prototype.open = function(method, url) {
      this.__vbenMock = {
        enabled: isMockRequest(url),
        method: String(method || 'GET').toUpperCase(),
        url: String(url || '')
      };
      return rawOpen.apply(this, arguments);
    };

    XHR.prototype.send = function(body) {
      var meta = this.__vbenMock;
      if (!meta || !meta.enabled) {
        return rawSend.apply(this, arguments);
      }

      var self = this;
      Promise.resolve(routeMock(normalizePath(meta.url), meta.method, parseBody(body)))
        .then(function(payload) {
          var text = JSON.stringify(payload);
          setTimeout(function() {
            setProp(self, 'status', 200);
            setProp(self, 'statusText', 'OK');
            setProp(self, 'responseURL', absUrl(meta.url) ? absUrl(meta.url).href : meta.url);
            setProp(self, 'responseText', text);
            setProp(self, 'response', text);
            setProp(self, 'readyState', 4);

            self.getAllResponseHeaders = function() { return 'content-type: application/json\r\n'; };
            self.getResponseHeader = function(name) {
              return String(name || '').toLowerCase() === 'content-type' ? 'application/json' : null;
            };

            if (typeof self.onreadystatechange === 'function') {
              self.onreadystatechange(new Event('readystatechange'));
            }
            if (typeof self.onload === 'function') {
              self.onload(new Event('load'));
            }
            if (typeof self.onloadend === 'function') {
              self.onloadend(new Event('loadend'));
            }
            if (typeof self.dispatchEvent === 'function') {
              try { self.dispatchEvent(new Event('readystatechange')); } catch (e) {}
              try { self.dispatchEvent(new Event('load')); } catch (e) {}
              try { self.dispatchEvent(new Event('loadend')); } catch (e) {}
            }
          }, 0);
        })
        .catch(function(error) {
          var payload = {
            code: 1,
            data: null,
            message: toSafeMessage(error, '请求失败'),
            timestamp: new Date().toISOString()
          };
          var text = JSON.stringify(payload);
          setTimeout(function() {
            setProp(self, 'status', 200);
            setProp(self, 'statusText', 'OK');
            setProp(self, 'responseURL', absUrl(meta.url) ? absUrl(meta.url).href : meta.url);
            setProp(self, 'responseText', text);
            setProp(self, 'response', text);
            setProp(self, 'readyState', 4);
            if (typeof self.onreadystatechange === 'function') {
              self.onreadystatechange(new Event('readystatechange'));
            }
            if (typeof self.onloadend === 'function') {
              self.onloadend(new Event('loadend'));
            }
          }, 0);
        });
    };
  }

  window.__VBEN_LOCAL_MOCK__ = true;
})();
