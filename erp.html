<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP系统 - 何哥的网站导航</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    <link rel="shortcut icon" href="../assets/images/favicon.png">
    <link rel="apple-touch-icon" href="../assets/images/favicon.png">
    
    <!-- 字体资源 -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/harmonyos-sans@1.0.6/css/harmonyos-sans.min.css" as="style">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans@1.0.6/css/harmonyos-sans.min.css">
    
    <!-- CSS样式文件 -->
    <link rel="stylesheet" href="../assets/css/bootstrap.css">
    <link rel="stylesheet" href="../assets/css/xenon-core.css">
    <link rel="stylesheet" href="../assets/css/xenon-components.css">
    <link rel="stylesheet" href="../assets/css/xenon-skins.css">
    <link rel="stylesheet" href="../assets/css/fonts/fontawesome/css/font-awesome.min.css">
    
    <style>
        /* ==================== 全局样式 ==================== */
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            font-family: "HarmonyOS Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #e0e0e0;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景装饰效果 */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
            animation: rotate 30s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ==================== 返回按钮 ==================== */
        .back-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 1000;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #e0e0e0;
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-5px);
            color: white;
        }

        /* ==================== ERP 主容器 ==================== */
        .erp-container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 80px 20px 40px;
        }

        .erp-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .erp-header h1 {
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #e0e0e0;
        }

        .erp-header p {
            color: #888;
            font-size: 16px;
        }

        /* ==================== 统计卡片 ==================== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(26, 26, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }

        .stat-card.blue::before {
            background: linear-gradient(90deg, #3b82f6, #2563eb);
        }

        .stat-card.green::before {
            background: linear-gradient(90deg, #10b981, #059669);
        }

        .stat-card.yellow::before {
            background: linear-gradient(90deg, #f59e0b, #d97706);
        }

        .stat-card.red::before {
            background: linear-gradient(90deg, #ef4444, #dc2626);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            font-size: 24px;
        }

        .stat-card.blue .stat-icon {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }

        .stat-card.green .stat-icon {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .stat-card.yellow .stat-icon {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .stat-card.red .stat-icon {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .stat-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 4px;
        }

        .stat-subtitle {
            font-size: 12px;
            color: #666;
        }

        /* ==================== 功能模块 ==================== */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .module-card {
            background: rgba(26, 26, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .module-card:hover {
            transform: translateY(-5px);
            border-color: #3b82f6;
            box-shadow: 0 12px 24px rgba(59, 130, 246, 0.2);
        }

        .module-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        .module-card:nth-child(1) .module-icon {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }

        .module-card:nth-child(2) .module-icon {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .module-card:nth-child(3) .module-icon {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }

        .module-card:nth-child(4) .module-icon {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        .module-card:nth-child(5) .module-icon {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
        }

        .module-info h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #e0e0e0;
        }

        .module-info p {
            font-size: 14px;
            color: #888;
            margin-bottom: 0;
        }

        /* ==================== 加载状态 ==================== */
        .loading-container {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #888;
            font-size: 16px;
        }

        /* ==================== 未登录状态 ==================== */
        .not-logged-in {
            text-align: center;
            padding: 60px 20px;
        }

        .not-logged-in i {
            font-size: 64px;
            color: #888;
            margin-bottom: 20px;
        }

        .not-logged-in h2 {
            font-size: 24px;
            color: #e0e0e0;
            margin-bottom: 10px;
        }

        .not-logged-in p {
            color: #888;
            margin-bottom: 30px;
        }

        .login-btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
        }

        /* ==================== 响应式设计 ==================== */
        @media (max-width: 768px) {
            .erp-container {
                padding: 60px 16px 20px;
            }

            .erp-header h1 {
                font-size: 28px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .modules-grid {
                grid-template-columns: 1fr;
            }

            .back-btn {
                padding: 8px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- 返回首页按钮 -->
    <a href="index.html" class="back-btn">
        <i class="fa fa-arrow-left"></i>
        返回首页
    </a>

    <!-- ERP 主容器 -->
    <div class="erp-container">
        <!-- 头部 -->
        <div class="erp-header">
            <h1><i class="fa fa-cubes" style="margin-right: 10px;"></i>ERP管理系统</h1>
            <p>企业资源计划系统 - 客户、产品、订单、库存、财务管理</p>
        </div>

        <!-- 加载中 -->
        <div id="loadingContainer" class="loading-container">
            <div class="loading-spinner"></div>
            <p class="loading-text">正在加载ERP系统...</p>
        </div>

        <!-- 未登录 -->
        <div id="notLoggedIn" class="not-logged-in" style="display: none;">
            <i class="fa fa-lock"></i>
            <h2>请先登录</h2>
            <p>您需要登录后才能使用ERP系统</p>
            <a href="login.html" class="login-btn">
                <i class="fa fa-sign-in" style="margin-right: 8px;"></i>立即登录
            </a>
        </div>

        <!-- ERP 内容 -->
        <div id="erpContent" style="display: none;">
            <!-- 统计卡片 -->
            <div class="stats-grid">
                <div class="stat-card blue">
                    <div class="stat-icon">
                        <i class="fa fa-users"></i>
                    </div>
                    <div class="stat-title">客户总数</div>
                    <div class="stat-value" id="statCustomers">0</div>
                    <div class="stat-subtitle">活跃客户：<span id="statActiveCustomers">0</span></div>
                </div>

                <div class="stat-card green">
                    <div class="stat-icon">
                        <i class="fa fa-box"></i>
                    </div>
                    <div class="stat-title">产品总数</div>
                    <div class="stat-value" id="statProducts">0</div>
                    <div class="stat-subtitle">库存预警：<span id="statLowStock">0</span></div>
                </div>

                <div class="stat-card yellow">
                    <div class="stat-icon">
                        <i class="fa fa-shopping-cart"></i>
                    </div>
                    <div class="stat-title">订单总数</div>
                    <div class="stat-value" id="statOrders">0</div>
                    <div class="stat-subtitle">待处理：<span id="statPendingOrders">0</span></div>
                </div>

                <div class="stat-card red">
                    <div class="stat-icon">
                        <i class="fa fa-money"></i>
                    </div>
                    <div class="stat-title">总收入</div>
                    <div class="stat-value" id="statRevenue">¥0</div>
                    <div class="stat-subtitle">净利润：<span id="statProfit">¥0</span></div>
                </div>
            </div>

            <!-- 功能模块 -->
            <div class="modules-grid">
                <div class="module-card" onclick="openModule('customers')">
                    <div class="module-icon">
                        <i class="fa fa-users"></i>
                    </div>
                    <div class="module-info">
                        <h3>客户管理</h3>
                        <p>管理客户信息、联系方式、备注等</p>
                    </div>
                </div>

                <div class="module-card" onclick="openModule('products')">
                    <div class="module-icon">
                        <i class="fa fa-box"></i>
                    </div>
                    <div class="module-info">
                        <h3>产品管理</h3>
                        <p>管理产品信息、价格、库存等</p>
                    </div>
                </div>

                <div class="module-card" onclick="openModule('orders')">
                    <div class="module-icon">
                        <i class="fa fa-shopping-cart"></i>
                    </div>
                    <div class="module-info">
                        <h3>订单管理</h3>
                        <p>创建和管理销售订单</p>
                    </div>
                </div>

                <div class="module-card" onclick="openModule('inventory')">
                    <div class="module-icon">
                        <i class="fa fa-warehouse"></i>
                    </div>
                    <div class="module-info">
                        <h3>库存管理</h3>
                        <p>查看库存记录、调整库存数量</p>
                    </div>
                </div>

                <div class="module-card" onclick="openModule('finance')">
                    <div class="module-icon">
                        <i class="fa fa-line-chart"></i>
                    </div>
                    <div class="module-info">
                        <h3>财务管理</h3>
                        <p>记录收入支出、查看财务报表</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../assets/js/supabase-config.js"></script>
    <script src="../assets/js/user-data.js"></script>
    <script src="../assets/js/erp.js"></script>

    <script>
        // ==================== 页面初始化 ====================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('[ERP Page] 页面加载完成');

            // 检查用户登录状态
            checkLoginStatus();

            // 监听用户数据加载完成
            window.addEventListener('userDataLoaded', function() {
                checkLoginStatus();
            });

            // 监听ERP数据加载完成
            window.addEventListener('erpDataLoaded', function(event) {
                console.log('[ERP Page] ERP数据加载完成:', event.detail);
                updateStatistics(event.detail);
                showERPContent();
            });
        });

        // ==================== 检查登录状态 ====================
        function checkLoginStatus() {
            if (userData.isLoggedIn) {
                console.log('[ERP Page] 用户已登录，显示ERP系统');
                // 等待ERP数据加载
            } else {
                console.log('[ERP Page] 用户未登录，显示登录提示');
                showNotLoggedIn();
            }
        }

        // ==================== 显示内容 ====================
        function showLoading() {
            document.getElementById('loadingContainer').style.display = 'block';
            document.getElementById('notLoggedIn').style.display = 'none';
            document.getElementById('erpContent').style.display = 'none';
        }

        function showNotLoggedIn() {
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('notLoggedIn').style.display = 'block';
            document.getElementById('erpContent').style.display = 'none';
        }

        function showERPContent() {
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('notLoggedIn').style.display = 'none';
            document.getElementById('erpContent').style.display = 'block';
        }

        // ==================== 更新统计数据 ====================
        function updateStatistics(data) {
            console.log('[ERP Page] 更新统计数据');

            const stats = ERP.getStatistics();

            // 更新客户统计
            document.getElementById('statCustomers').textContent = stats.customers.total;
            document.getElementById('statActiveCustomers').textContent = stats.customers.active;

            // 更新产品统计
            document.getElementById('statProducts').textContent = stats.products.total;
            document.getElementById('statLowStock').textContent = stats.products.lowStock;

            // 更新订单统计
            document.getElementById('statOrders').textContent = stats.orders.total;
            document.getElementById('statPendingOrders').textContent = stats.orders.pending;

            // 更新财务统计
            document.getElementById('statRevenue').textContent = '¥' + stats.finances.totalIncome.toLocaleString();
            document.getElementById('statProfit').textContent = '¥' + stats.finances.netProfit.toLocaleString();
        }

        // ==================== 打开模块 ====================
        function openModule(moduleName) {
            console.log('[ERP Page] 打开模块:', moduleName);

            // 这里可以根据不同的模块名称打开不同的页面或模态框
            // 暂时显示提示信息
            if (typeof showToast === 'function') {
                showToast(`${moduleName} 模块正在开发中...`, 'info');
            } else {
                alert(`${moduleName} 模块正在开发中...`);
            }

            // TODO: 实现各个模块的具体功能
            // 例如：
            // window.location.href = `erp-${moduleName}.html`;
            // 或者打开模态框
        }
    </script>
</body>
</html>
